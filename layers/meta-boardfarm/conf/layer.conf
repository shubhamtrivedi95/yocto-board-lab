# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-boardfarm"
BBFILE_PATTERN_meta-boardfarm = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-boardfarm = "6"

LAYERDEPENDS_meta-boardfarm = "core"
LAYERSERIES_COMPAT_meta-boardfarm = "wrynose"

BBFILES_DYNAMIC += "\
    meta-beagle:${LAYERDIR}/dynamic-layers/meta-ti/meta-beagle/recipes-kernel/linux/linux-bb.org_6.12.bbappend \
    meta-ti-extras:${LAYERDIR}/dynamic-layers/meta-ti/meta-ti-extras/recipes-bsp/cc33xx-fw/cc33xx-fw_git.bbappend \
    freescale-layer:${LAYERDIR}/dynamic-layers/meta-freescale/recipes-bsp/u-boot/u-boot-imx_2025.04.bbappend \
"